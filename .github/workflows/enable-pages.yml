name: Enable GitHub Pages

on:
  push:
    paths:
      - ".github/workflows/enable-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages for workflow deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"build_type":"workflow"}')
          cat /tmp/pages-response.json || true
          echo "HTTP $code"
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          exit 1
