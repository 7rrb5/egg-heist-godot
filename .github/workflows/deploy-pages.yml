name: Build Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Assemble main game script
        run: cat scripts/game.part00 scripts/game.part01 scripts/game.part02 scripts/game.part03 scripts/game.part04 > scripts/game.gd

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Install official Godot 4.7.2 Web template
        run: |
          set -euxo pipefail
          curl -L --retry 3 -o /tmp/godot_templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf /tmp/godot_tpl
          mkdir -p /tmp/godot_tpl
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp /tmp/godot_tpl/templates/web_nothreads_release.zip "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          cp /tmp/godot_tpl/templates/version.txt "$HOME/.local/share/godot/export_templates/4.7.2.stable/" || true
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Runtime smoke test
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 180 --verbose 2>&1 | tee /tmp/runtime.log
          if grep -E "SCRIPT ERROR|Invalid call|Invalid access|ERROR:" /tmp/runtime.log; then
            echo "Runtime errors detected"
            exit 1
          fi

      - name: Functional gameplay test
        run: godot --headless --path . --script res://scripts/functional_smoke.gd

      - name: Export Web
        run: |
          rm -rf web
          mkdir -p web
          godot --headless --path . --export-release "Web" web/index.html
          test -f web/index.html
          test -f web/index.wasm
          test -f web/index.pck
          ls -lh web

      - name: Publish web-build branch
        run: |
          set -euxo pipefail
          rm -rf /tmp/egg-web
          mkdir -p /tmp/egg-web
          cp -a web/. /tmp/egg-web/
          cd /tmp/egg-web
          git init
          git checkout -b web-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "Godot Web build $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin web-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
