name: Build Godot Web and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble main game script
        run: cat scripts/game.part00 scripts/game.part01 scripts/game.part02 scripts/game.part03 scripts/game.part04 > scripts/game.gd

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Install official Godot 4.7.2 export templates
        run: |
          set -euxo pipefail
          curl -L --retry 3 -o /tmp/godot_templates.tpz             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf /tmp/godot_tpl
          mkdir -p /tmp/godot_tpl
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/godot_tpl/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
          ls -lh "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Export Web
        run: |
          mkdir -p web
          godot --verbose --headless --path . --export-release "Web" web/index.html
          test -f web/index.html
          test -f web/index.wasm
          test -f web/index.pck

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
