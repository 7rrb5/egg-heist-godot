name: Build Godot Web and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Godot project
        run: |
          rm -rf build-project
          mkdir -p build-project
          unzip -q egg-heist-godot-v1.zip -d build-project
          echo "PROJECT_DIR=$(find build-project -name project.godot -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path "$PROJECT_DIR" --import --quit

      - name: Export Web
        run: |
          mkdir -p "$PROJECT_DIR/web"
          godot --headless --path "$PROJECT_DIR" --export-release Web "$PROJECT_DIR/web/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
